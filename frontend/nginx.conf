# Liefert die gebaute Oberflaeche aus und reicht '/aas/...' an den
# AAS-Server weiter (wie der Vite-Proxy im Dev-Betrieb, siehe vite.config.ts).
# "aas-env" ist der Dienstname aus docker-compose.yml.

server {
  listen 80;
  root /usr/share/nginx/html;

  location /aas/ {
    proxy_pass http://aas-env:8081/;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
  }

  location / {
    try_files $uri /index.html;
  }
}
