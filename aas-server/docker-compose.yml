# Eigener AAS-Server fuer die WAGO-EPD-Pakete
#
#   docker compose up -d        (im Ordner aas-server)
#
#   API (AAS Part 2, v3.0):  http://localhost:8081/shells
#                            http://localhost:8081/submodels
#   AAS Web UI ("Portal"):   http://localhost:3000

services:
  aas-env:
    image: eclipsebasyx/aas-environment:2.0.0-milestone-15
    container_name: wago-aas-env
    ports:
      - "8081:8081"
    volumes:
      - ./aas-env.properties:/application/application.properties:ro
      - ../epd/221/aasx:/application/aas221:ro
      - ../epd/2273/aasx:/application/aas2273:ro
    restart: unless-stopped

  aas-web-ui:
    image: eclipsebasyx/aas-gui:v2-260924
    container_name: wago-aas-web-ui
    ports:
      - "3000:3000"
    environment:
      AAS_REPO_PATH: http://localhost:8081/shells
      SUBMODEL_REPO_PATH: http://localhost:8081/submodels
      CD_REPO_PATH: http://localhost:8081/concept-descriptions
    depends_on:
      - aas-env
    restart: unless-stopped
