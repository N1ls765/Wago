# Konfiguration des Eclipse BaSyx AAS Environment
# (AAS-Repository + Submodel-Repository + ConceptDescription-Repository)

server.port=8081

# Daten nur im Speicher: bei jedem Start werden die AASX-Pakete neu eingelesen.
# Das reicht, solange die Skripte die Pakete erzeugen und der Server nur liest.
basyx.backend=InMemory

# Diese Ordner werden beim Start eingelesen (kommagetrennt, relativ zu /application)
basyx.environment=file:aas221,file:aas2273

# Zugriff aus dem Browser (Vite-Dev-Server, AAS Web UI)
basyx.cors.allowed-origins=*
basyx.cors.allowed-methods=GET,POST,PATCH,DELETE,PUT,OPTIONS,HEAD
